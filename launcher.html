<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Virtual Keyboard Launcher</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 300px;
            background-color: #f3f4f6;
        }

        .card {
            max-width: 400px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .button {
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            margin-top: 10px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: #3b82f6;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #2563eb;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: #3b82f6;
            font-weight: 500;
            text-decoration: underline;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>
    <div class="card p-6 flex flex-col items-center space-y-4">
        <h3 class="text-xl font-semibold text-gray-800">Virtual Keyboard Launcher</h3>
        <ul class="w-full space-y-4">
            <li>
                <a href="#" class="button" id="SOSK-MINI">SOSK-MINI</a>
            </li>
            <li>
                <a href="#" class="button" id="SOSK-FULLSCREEN">SOSK-FULLSCREEN</a>
            </li>
        </ul>
        <a class="link" href="#" id="settings">Settings for SOSK-MINI</a>
    </div>
    <script src="/set/popup.js"></script>
</body>

</html>
