<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Virtual Keyboard Launcher</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            width: 200px;
            padding: 20px;
        }

        input[type=checkbox] {
            height: 0;
            width: 0;
            visibility: hidden;
        }

        label {
            cursor: pointer;
            text-indent: -9999px;
            width: 60px;
            height: 30px;
            background: grey;
            display: block;
            border-radius: 30px;
            position: relative;
        }

        label:after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 26px;
            transition: 0.3s;
        }

        input:checked+label {
            background: #bada55;
        }

        input:checked+label:after {
            left: calc(100% - 2px);
            transform: translateX(-100%);
        }

        label:active:after {
            width: 30px;
            /* ปรับขนาด */
        }
    </style>
</head>

<body>
    <div class="flex flex-col items-center justify-center">
        <h3 class="p-2">ON/OFF (SOSK)</h3>
        <input type="checkbox" id="openKeyboard" />
        <label for="openKeyboard">Toggle Virtual Keyboard</label>
        <script src="/set/popup.js"></script>
    </div>

</body>

</html>
